name: Train and Deploy Models

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark==3.5.0 streamlit pandas numpy matplotlib seaborn plotly scikit-learn

      - name: Run Pipeline
        run: python scripts/run_pipeline.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Commit and Push Models
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ outputs/
          git commit -m "Automated Model Training & Artifact Generation [skip ci]" || echo "No changes to commit"
          git push
